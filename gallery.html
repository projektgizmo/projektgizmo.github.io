        <main class="container gallery-page">
            <header class="gallery-page__header">
                <span class="gallery-page__eyebrow">Project Gizmo</span>
                <h1 class="page-title">Gallery</h1>
                <p class="lead">Explore Gizmo through our projects, models, and robot development.</p>
            </header>

            <section class="gallery-section" aria-label="Project Gizmo photo gallery">
                <div class="gallery-grid">
                    <figure class="gallery-item gallery-item--featured">
                        <div class="gallery-item__visual">
                            <img src="public/external/gizmo_tasma.png" alt="Modular Gizmo robot on a production conveyor" class="gallery-item__image">
                        </div>
                        <figcaption class="gallery-item__caption">
                            <span class="gallery-item__number">01 / In action</span>
                            <span>Gizmo working on a production conveyor</span>
                        </figcaption>
                    </figure>
                    <figure class="gallery-item">
                        <div class="gallery-item__visual">
                            <img src="public/external/kula_gizmula.png" alt="Structure assembled from connected Gizmo modules" class="gallery-item__image">
                        </div>
                        <figcaption class="gallery-item__caption">
                            <span class="gallery-item__number">02 / Modular design</span>
                            <span>A structure assembled from Gizmo modules</span>
                        </figcaption>
                    </figure>
                    <figure class="gallery-item">
                        <div class="gallery-item__visual">
                            <img src="public/external/blizniak.png" alt="Two 3D-printed Gizmo robots" class="gallery-item__image">
                        </div>
                        <figcaption class="gallery-item__caption">
                            <span class="gallery-item__number">03 / Prototypes</span>
                            <span>3D-printed Gizmo robots</span>
                        </figcaption>
                    </figure>
