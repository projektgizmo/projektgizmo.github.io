        <header class="navbar">
            <div class="container navbar__container">
                <a href="index.html" class="navbar__logo">

        <main class="container gallery-page">
            <header class="gallery-page__header">
                <span class="gallery-page__eyebrow">Projekt Gizmo</span>
                <h1 class="page-title">Galeria</h1>
                <p class="lead">Zobacz Gizmo w projektach, modelach i pracy nad robotami.</p>
            </header>

            <section class="gallery-section" aria-label="Galeria zdjęć projektu Gizmo">
                <div class="gallery-grid">
                    <figure class="gallery-item gallery-item--featured">
                        <div class="gallery-item__visual">
                            <img src="public/external/gizmo_tasma.png" alt="Robot modułowy Gizmo na taśmie produkcyjnej" class="gallery-item__image">
                        </div>
                        <figcaption class="gallery-item__caption">
                            <span class="gallery-item__number">01 / W praktyce</span>
                            <span>Gizmo podczas pracy na taśmie produkcyjnej</span>
                        </figcaption>
                    </figure>
                    <figure class="gallery-item">
                        <div class="gallery-item__visual">
                            <img src="public/external/kula_gizmula.png" alt="Konstrukcja złożona z połączonych modułów Gizmo" class="gallery-item__image">
                        </div>
                        <figcaption class="gallery-item__caption">
                            <span class="gallery-item__number">02 / Modułowość</span>
                            <span>Konstrukcja złożona z modułów Gizmo</span>
                        </figcaption>
                    </figure>
                    <figure class="gallery-item">
                        <div class="gallery-item__visual">
                            <img src="public/external/blizniak.png" alt="Dwa wydrukowane roboty Gizmo" class="gallery-item__image">
                        </div>
                        <figcaption class="gallery-item__caption">
                            <span class="gallery-item__number">03 / Prototypy</span>
                            <span>Wydrukowane roboty Gizmo</span>
                        </figcaption>
                    </figure>
                </div>

                <p><img src="public/external/instagram-svgrepo-com.svg" alt="Instagram icon" class="contact-icon" /> <a href="https://www.instagram.com/projekt_gizmo/" target="https://www.instagram.com/projekt_gizmo/">@projekt_gizmo</a></p>
                <p><img src="public/external/linkedin-fill-svgrepo-com.svg" alt="LinkedIn icon" class="contact-icon" /> <a href="https://www.linkedin.com/company/projekt-gizmo/" target="">Projekt Gizmo</a></p>
                <p><img src="public/external/facebook-svgrepo-com.svg" alt="Facebook icon" class="contact-icon" /> <a href="https://www.facebook.com/profile.php?id=61575747850184" target="https://www.facebook.com/profile.php?id=61575747850184">Projekt Gizmo</a></p>
