<!DOCTYPE html>
<html lang="{{language}}">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="{{description}}" />
        <title>{{title}} - {{siteName}}</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Aldrich&family=Raleway:wght@400;500;600;700;800;900&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{base}}src/styles/site.css" />
        <script src="{{base}}src/scripts/navigation.js" defer></script>
    </head>
    <body>
        <div class="background-decor">
            <div class="ellipse ellipse-1"></div>
            <div class="ellipse ellipse-2"></div>
            <div class="ellipse ellipse-3"></div>
            <div class="ellipse ellipse-4"></div>
            <div class="ellipse ellipse-5"></div>
            <div class="decorative-circle circle-index-1"></div>
            <div class="decorative-circle circle-index-2"></div>
            <div class="decorative-circle circle-index-3"></div>
        </div>

        <header class="navbar">
            <div class="container navbar__container">
                <a href="./index.html" class="navbar__logo"><span>gizmo</span></a>
                <button class="navbar__toggle" type="button" aria-controls="site-navigation" aria-expanded="false" aria-label="{{menuOpen}}">
                    <span></span><span></span><span></span>
                </button>
                <nav class="navbar__nav" id="site-navigation">
                    <ul class="navbar__links">{{navigation}}</ul>
                </nav>
                <div class="navbar__lang-switcher">
                    <a href="{{plUrl}}" class="navbar__lang {{plActive}}">PL</a>
                    <span>/</span>
                    <a href="{{enUrl}}" class="navbar__lang {{enActive}}">ENG</a>
                </div>
            </div>
        </header>

        <main class="container contact-page">
            <span class="gallery-page__eyebrow">{{mockLabel}}</span>
            <h1 class="page-title">{{title}}</h1>
            <p class="lead">{{intro}}</p>

            <section class="info-section" aria-label="{{sectionTitle}}">
                {{cards}}
            </section>

            <div class="deployments-cta">
                <p>{{ctaText}}</p>
                <a href="{{contactUrl}}" class="btn btn--outline">{{backLabel}}</a>
            </div>
        </main>

        <footer id="contact" class="footer">
            <div class="container">
                <h2 class="section-title">{{contactTitle}}</h2>
                <address class="footer__contact-info">
                    <p><img src="{{base}}public/external/mail.svg" alt="" class="contact-icon" /> <a href="mailto:gizmoprojekt@gmail.com">gizmoprojekt@gmail.com</a></p>
                    <p><img src="{{base}}public/external/instagram-svgrepo-com.svg" alt="" class="contact-icon" /> <a href="https://www.instagram.com/projekt_gizmo/" target="_blank" rel="noreferrer">@projekt_gizmo</a></p>
                    <p><img src="{{base}}public/external/linkedin-fill-svgrepo-com.svg" alt="" class="contact-icon" /> <a href="https://www.linkedin.com/company/projekt-gizmo/" target="_blank" rel="noreferrer">Projekt Gizmo</a></p>
                </address>
            </div>
        </footer>
    </body>
</html>
